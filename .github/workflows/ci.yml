name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      # actions/checkout@v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        # actions/setup-python@v5.6.0
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Version consistency
        run: |
          python - <<'PY'
          import json, re, pathlib, sys
          root = pathlib.Path(".")
          pp = re.search(r'version\s*=\s*"([^"]+)"', (root/"pyproject.toml").read_text()).group(1)
          init = re.search(r'__version__\s*=\s*"([^"]+)"', (root/"mesa_ibi_scanner/__init__.py").read_text()).group(1)
          cff = re.search(r'^version:\s*(\S+)', (root/"CITATION.cff").read_text(), re.M).group(1)
          zj = json.loads((root/".zenodo.json").read_text())["version"]
          print(f"pyproject={pp} init={init} cff={cff} zenodo={zj}")
          if len({pp, init, cff, zj}) != 1:
              sys.exit("version drift across pyproject.toml / __init__ / CITATION.cff / .zenodo.json")
          PY
      - name: Run tests
        run: pytest -q
      - name: CLI smoke (fixture + topology + sarif)
        run: |
          mesa-ibi-scan --fixture hf_like --format text
          # --exit-code returns 1 on violation; must not trip bash -e
          set +e
          mesa-ibi-scan --input schemas/examples/topology-hf-like.json --format json --exit-code
          ec=$?
          set -e
          test "$ec" -eq 1
          mesa-ibi-scan --fixture hf_like_gated --format sarif --exit-code

  t0:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # actions/setup-python@v5.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.3"
      - name: Install package and T0 tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -r .github/harness/requirements-t0.txt
      - name: T0 static
        run: make t0

  t1:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # actions/setup-python@v5.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.3"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: T1 unit
        run: make t1

  # Pull-request enforcement is the protected-paths job in protected-paths.yml
  # (pull_request_target, base checkout only). This job is a different name
  # so a skip on pull requests cannot satisfy that required check. It only
  # runs on a push to main and diffs github.event.before...github.sha.
  protected-paths-push-audit:
    name: protected-paths-push-audit
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Protected-path check (push)
        env:
          GITHUB_EVENT_NAME: push
          OWNER_APPROVED: "false"
          DIFF_BASE: ${{ github.event.before }}
          DIFF_HEAD: ${{ github.sha }}
        run: python3 .github/harness/check_protected_paths.py

  t2:
    needs: [t0, t1]
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # actions/setup-python@v5.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.3"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: T2 property
        run: make t2

  t3:
    needs: [t0, t1]
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # actions/setup-python@v5.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.3"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: T3 golden (public)
        run: make t3

  t3-holdout:
    needs: [t0, t1]
    runs-on: ubuntu-latest
    steps:
      - name: Holdout is owner-dispatched
        run: |
          echo "holdout: runs in holdout.yml (owner-dispatched)"
          exit 0

  evidence:
    needs: [t2, t3]
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      # actions/checkout@v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: github.event_name == 'push'
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch base
        env:
          BASE: ${{ github.base_ref || 'main' }}
        run: git fetch --no-tags origin "+refs/heads/${BASE}:refs/remotes/origin/${BASE}"
      # actions/setup-python@v5.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.3"
      - name: Install package and T0 tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -r .github/harness/requirements-t0.txt
      - name: Regenerate evidence and diff
        env:
          BASE_REF: origin/${{ github.base_ref || 'main' }}
        run: python3 .github/harness/check_evidence_diff.py
