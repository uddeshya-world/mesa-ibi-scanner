name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Version consistency
        run: |
          python - <<'PY'
          import json, re, pathlib, sys
          root = pathlib.Path(".")
          pp = re.search(r'version\s*=\s*"([^"]+)"', (root/"pyproject.toml").read_text()).group(1)
          init = re.search(r'__version__\s*=\s*"([^"]+)"', (root/"mesa_ibi_scanner/__init__.py").read_text()).group(1)
          cff = re.search(r'^version:\s*(\S+)', (root/"CITATION.cff").read_text(), re.M).group(1)
          zj = json.loads((root/".zenodo.json").read_text())["version"]
          print(f"pyproject={pp} init={init} cff={cff} zenodo={zj}")
          if len({pp, init, cff, zj}) != 1:
              sys.exit("version drift across pyproject.toml / __init__ / CITATION.cff / .zenodo.json")
          PY
      - name: Run tests
        run: pytest -q
      - name: CLI smoke (fixture + topology + sarif)
        run: |
          mesa-ibi-scan --fixture hf_like --format text
          # --exit-code returns 1 on violation; must not trip bash -e
          set +e
          mesa-ibi-scan --input schemas/examples/topology-hf-like.json --format json --exit-code
          ec=$?
          set -e
          test "$ec" -eq 1
          mesa-ibi-scan --fixture hf_like_gated --format sarif --exit-code

  t0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"
      - name: Install package and T0 tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -r .github/harness/requirements-t0.txt
      - name: T0 static
        run: make t0

  t1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: T1 unit
        run: make t1

  protected-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch base
        env:
          BASE: ${{ github.base_ref || 'main' }}
        run: git fetch --no-tags origin "+refs/heads/${BASE}:refs/remotes/origin/${BASE}"
      - name: Protected-path check (pull request)
        if: github.event_name == 'pull_request'
        env:
          GITHUB_EVENT_NAME: pull_request
          OWNER_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'owner-approved') }}
          BASE_REF: origin/${{ github.base_ref }}
        run: python3 .github/harness/check_protected_paths.py
      - name: Protected-path check (push)
        if: github.event_name == 'push'
        env:
          GITHUB_EVENT_NAME: push
          OWNER_APPROVED: "false"
          BASE_REF: origin/main
        run: python3 .github/harness/check_protected_paths.py

  t2:
    needs: [t0, t1]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: T2 property
        run: make t2

  t3:
    needs: [t0, t1]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: T3 golden (public)
        run: make t3

  t3-holdout:
    needs: [t0, t1]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: T3 holdout
        env:
          MESA_HOLDOUT_TOKEN: ${{ secrets.MESA_HOLDOUT_TOKEN }}
        run: python3 .github/harness/holdout.py

  evidence:
    needs: [t2, t3]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/checkout@v4
        if: github.event_name == 'push'
        with:
          fetch-depth: 0
      - name: Fetch base
        env:
          BASE: ${{ github.base_ref || 'main' }}
        run: git fetch --no-tags origin "+refs/heads/${BASE}:refs/remotes/origin/${BASE}"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"
      - name: Install package and T0 tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -r .github/harness/requirements-t0.txt
      - name: Regenerate evidence and diff
        env:
          BASE_REF: origin/${{ github.base_ref || 'main' }}
          MESA_HOLDOUT_TOKEN: ${{ secrets.MESA_HOLDOUT_TOKEN }}
        run: python3 .github/harness/check_evidence_diff.py
