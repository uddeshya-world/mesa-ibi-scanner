[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mesa-ibi-scanner"
version = "0.3.2"
description = "Research prototype: MESA Invariant 1 Cl(b) reachability fixpoint (not production)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Uddeshya Kumar" }]
keywords = [
  "mesa",
  "agentic-security",
  "multi-agent",
  "interaction-boundary",
  "ensemble-trifecta",
  "least-agency",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Typing :: Typed",
]
dependencies = [
  "jsonschema>=4.18",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
mesa-ibi-scan = "mesa_ibi_scanner.cli:main"

[project.urls]
Homepage = "https://github.com/uddeshya-world/mesa-ibi-scanner"
Documentation = "https://doi.org/10.5281/zenodo.22744547"
"Bug Tracker" = "https://github.com/uddeshya-world/mesa-ibi-scanner/issues"
DOI = "https://doi.org/10.5281/zenodo.22744547"

[tool.setuptools.packages.find]
where = ["."]
include = ["mesa_ibi_scanner*"]

[tool.setuptools.package-data]
mesa_ibi_scanner = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
