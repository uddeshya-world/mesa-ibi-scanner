[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mesa-ibi-scanner"
version = "0.4.0"
description = "Research prototype: MESA Invariant 1 Cl(b) reachability fixpoint (not production)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Uddeshya Kumar" }]
keywords = [
  "mesa",
  "agentic-security",
  "multi-agent",
  "interaction-boundary",
  "ensemble-trifecta",
  "least-agency",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Typing :: Typed",
]
dependencies = [
  "jsonschema>=4.18",
]

[project.optional-dependencies]
sign = ["cryptography>=42"]
dev = ["pytest>=7.0", "cryptography>=42"]

[project.scripts]
mesa-ibi-scan = "mesa_ibi_scanner.cli:main"

[project.urls]
Homepage = "https://github.com/uddeshya-world/mesa-ibi-scanner"
# Paper concept DOI (stable cite). Not a software DOI; that is minted later.
Documentation = "https://doi.org/10.5281/zenodo.22743175"
"Bug Tracker" = "https://github.com/uddeshya-world/mesa-ibi-scanner/issues"
DOI = "https://doi.org/10.5281/zenodo.22743175"

[tool.setuptools.packages.find]
where = ["."]
include = ["mesa_ibi_scanner*"]

[tool.setuptools.package-data]
mesa_ibi_scanner = ["py.typed", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mutmut]
# T8 (weekly): closure (graph.py, lattice.py) and frontier (lattice.py). Property tests run at MESA_T2_CASES=200.
source_paths = ["mesa_ibi_scanner"]
only_mutate = ["mesa_ibi_scanner/graph.py", "mesa_ibi_scanner/lattice.py"]
pytest_add_cli_args_test_selection = ["tests/test_closure.py", "tests/test_lattice_unit.py", "tests/test_lattice_golden.py",
                                      "tests/test_lattice_properties.py", "tests/test_properties.py", "tests/test_cli_output.py"]
also_copy = ["fixtures", "thresholds", "schemas", "tests"]
